[project]
name = "panna"
version = "0.1.0"
description = "AI-driven match intelligence for the Microsoft Premier League Inside the Game hackathon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openai>=1.50",
    # Microsoft Agent Framework — Chalk's reasoning loop (tool-calling agents
    # on Azure OpenAI / Foundry). Degrades to the deterministic analyst when
    # no Foundry credentials are configured.
    "agent-framework>=1.23",
    # Model Context Protocol — exposes the match toolkit to any MCP client
    # (Copilot, Claude Desktop, custom agents).
    "mcp>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
panna-run = "src.cli:main"
panna-mcp = "src.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
